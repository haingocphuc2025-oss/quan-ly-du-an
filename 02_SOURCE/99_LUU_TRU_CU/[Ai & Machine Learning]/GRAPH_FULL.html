<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1e2e;color:#cdd6f4;font-family:Inter,'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
svg{display:block}
.edge{fill:none;stroke:#313244;stroke-width:1;stroke-opacity:0.2}
.edge.hl{stroke:#89b4fa;stroke-opacity:0.7;stroke-width:2}
.node circle{stroke:#1e1e2e;stroke-width:1.5;cursor:pointer;transition:r .15s,stroke-width .15s}
.node:hover circle{stroke:#f5c2e7;stroke-width:3;filter:drop-shadow(0 0 8px rgba(245,194,231,0.3))}
.node.focused circle{stroke:#f5c2e7;stroke-width:4;filter:drop-shadow(0 0 14px rgba(245,194,231,0.45))}
.node-label{font-size:9px;fill:#6c7086;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.node.focused .node-label,.node:hover .node-label{fill:#cdd6f4;font-weight:600}
.label-hide{opacity:0;transition:opacity .2s;pointer-events:none;text-anchor:middle;fill:#a6adc8;font-size:9px}
.node:hover .label-hide,.node.focused .label-hide{opacity:1}
.tooltip{position:fixed;z-index:200;background:rgba(24,24,37,.94);backdrop-filter:blur(16px);padding:10px 14px;border-radius:10px;border:1px solid #45475a;box-shadow:0 8px 32px rgba(0,0,0,.5);font-size:12px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .12s;max-width:320px}
.tooltip.show{opacity:1}
.tt-name{font-weight:700;font-size:13px;margin-bottom:2px}
.tt-meta{color:#6c7086;font-size:11px}
.controls{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:6px;background:rgba(30,30,46,.88);backdrop-filter:blur(14px);padding:6px 14px;border-radius:10px;border:1px solid #313244;box-shadow:0 4px 20px rgba(0,0,0,.35);flex-wrap:wrap;justify-content:center;max-width:92vw}
.controls button{background:#313244;border:1px solid #45475a;color:#cdd6f4;padding:4px 10px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:500;transition:all .12s}
.controls button:hover{background:#45475a}
.controls button.active{background:#89b4fa;color:#1e1e2e;border-color:#89b4fa;font-weight:700}
.controls .sep{width:1px;background:#313244;margin:0 4px}
.stats{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(30,30,46,.85);backdrop-filter:blur(14px);padding:8px 20px;border-radius:10px;border:1px solid #313244;font-size:12px;display:flex;gap:16px;pointer-events:none;opacity:0;transition:opacity .25s}
.stats.visible{opacity:1;pointer-events:auto}
.stats .s-label{color:#585b70;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.stats .s-val{color:#cdd6f4;font-weight:600}
.legend{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:50;background:rgba(30,30,46,.8);backdrop-filter:blur(12px);padding:10px 12px;border-radius:10px;border:1px solid #313244;font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;padding:2px 0;white-space:nowrap}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.legend-count{color:#585b70;font-size:10px;margin-left:auto}
</style>

    if(d.label==='CSS Component')return d.name.replace('CSS: ','').slice(0,4);
    if(d.label==='DOM Section')return d.name.split('(')[0].trim().slice(0,3);
    return'';
  });
  nd.append('text').attr('class','label-hide').attr('dy',function(d){return rOf(d)+14;}).text(function(d){var n=d.name.replace('()','');return n.length>25?n.slice(0,23)+'...':n;});
  var tt = d3.select('#tooltip');
  nd.on('mouseenter',function(e,d){
    tt.html('<div class="tt-name">'+d.name+'</div><div class="tt-meta">'+d.label+(d.module?' &middot; '+d.module:'')+(d.file?' &middot; '+d.file:'')+'</div>');
    tt.classed('show',1).style('left',(e.pageX+14)+'px').style('top',(e.pageY-10)+'px');
    var ids=new Set();lv.forEach(function(l){
      var s=typeof l.source==='object'?l.source.id:l.source;
      var t=typeof l.target==='object'?l.target.id:l.target;
      if(s===d.id||t===d.id){ids.add(s);ids.add(t);}
    });
    nd.classed('focused',function(n){return ids.has(n.id);});
    ep.classed('hl',function(l){
      var s=typeof l.source==='object'?l.source.id:l.source;
      var t=typeof l.target==='object'?l.target.id:l.target;
      return s===d.id||t===d.id;
    });
  }).on('mousemove',function(e){tt.style('left',(e.pageX+14)+'px').style('top',(e.pageY-10)+'px');})
  .on('mouseleave',function(){tt.classed('show',0);nd.classed('focused',0);ep.classed('hl',0);});
  sim.on('tick',function(){
    nd.attr('transform',function(d){return'translate('+d.x+','+d.y+')';});
    ep.attr('d',function(d){
      var s=typeof d.source==='object'?d.source:nmap[d.source];
      var t=typeof d.target==='object'?d.target:nmap[d.target];
      if(!s||!t)return'';
      var dx=t.x-s.x,dy=t.y-s.y,len=Math.sqrt(dx*dx+dy*dy)||1;
      var bend=Math.min(25,len*0.08),cx=(s.x+t.x)/2,cy=(s.y+t.y)/2;
      var nx=-dy/len,ny=dx/len;
      return'M'+s.x+','+s.y+'Q'+(cx+nx*bend)+','+(cy+ny*bend)+' '+t.x+','+t.y;
    });
  });
  d3.select('#st-nodes').text(show.size);
  d3.select('#st-edges').text(lv.length);
}
function buildUI(){
  var ctrl=d3.select('#controls');
  ctrl.append('button').attr('data-f','all').classed('active',1).text('All ('+NODES.length+')');
  ctrl.append('span').attr('class','sep');
  TYPE_ORDER.forEach(function(t){if(LC[t])ctrl.append('button').attr('data-f',t).text(t+' ('+LC[t]+')');});
  ctrl.append('span').attr('class','sep');
  ctrl.append('button').attr('id','lockBtn').text('🔓 Lock');
  ctrl.append('button').attr('id','resetBtn').text('⟲ Reset');
  ctrl.append('button').attr('id','pngBtn').text('📷 PNG');
  d3.selectAll('button[data-f]').on('click',function(){
    d3.selectAll('button[data-f]').classed('active',0);
    d3.select(this).classed('active',1);
    curFilter=this.dataset.f;draw(curFilter);
  });
}
d3.select('#lockBtn').on('click',function(){locked=!locked;this.textContent=locked?'🔒 Locked':'🔓 Lock';if(!locked){NODES.forEach(function(n){n.fx=null;n.fy=null;});sim.alpha(0.3).restart();}});
d3.select('#resetBtn').on('click',function(){NODES.forEach(function(n){n.fx=null;n.fy=null;});sim.alpha(0.8).restart();d3.selectAll('.node').classed('focused',0);svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);});
d3.select('#pngBtn').on('click',function(){var s=new XMLSerializer().serializeToString(svg.node());var c='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'">'+s.slice(s.indexOf('>')+1,s.lastIndexOf('</svg>'))+'</svg>';var b=new Blob([c],{type:'image/svg+xml;charset=utf-8'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='graph-v23.png';a.click();URL.revokeObjectURL(u);});
function buildLegend(){
  var lg=d3.select('#legend');
  TYPE_ORDER.forEach(function(t){if(LC[t])lg.append('div').attr('class','legend-item').html('<span class="legend-dot" style="background:'+TYPE_COLORS[t]+'"></span> '+t+' <span class="legend-count">'+LC[t]+'</span>');});
}
buildUI();buildLegend();draw('all');sim.alpha(0.6).restart();d3.select('#stats').classed('visible',1);
</script>
